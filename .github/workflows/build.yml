name: Build Icon110 package

on:
  workflow_dispatch:
  push:
    branches: [master, main, mox1]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz
          mkdir -p "$HOME/theos/sdks"
          cp -R sdks-master/*.sdk "$HOME/theos/sdks/"

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          export THEOS="$HOME/theos"
          gmake clean package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Icon110
          path: packages/*.deb
          if-no-files-found: error
