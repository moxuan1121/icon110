name: Build Icon110 RootHide package

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-roothide:
    name: Build RootHide
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build tools
        run: brew install dpkg ldid make xz

      - name: Install RootHide Theos and SDK
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos-roothide"
          mkdir -p "$HOME/theos-roothide/sdks"
          curl -fL \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$HOME/theos-roothide/sdks"

      - name: Build RootHide package
        run: |
          export THEOS="$HOME/theos-roothide"
          gmake clean
          gmake package FINALPACKAGE=1

      - name: Audit RootHide package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one DEB, found ${#packages[@]}" >&2
            exit 1
          fi

          deb="${packages[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "com.moxuan.icon110"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"

          control_entries="$(dpkg-deb --ctrl-tarfile "$deb" | tar -tf - | sed 's#^\./##' | sed '/^$/d')"
          unexpected_control="$(printf '%s\n' "$control_entries" | grep -Ev '^(control|\.)$' || true)"
          if [[ -n "$unexpected_control" ]]; then
            echo "Unexpected control archive entries:" >&2
            printf '%s\n' "$unexpected_control" >&2
            exit 1
          fi

          data_entries="$(dpkg-deb --fsys-tarfile "$deb" | tar -tf - | sed 's#^\./##' | sed '/^$/d')"
          unexpected_data="$(printf '%s\n' "$data_entries" | grep -Ev '^($|\.|Library/?$|Library/MobileSubstrate/?$|Library/MobileSubstrate/DynamicLibraries/?$|Library/MobileSubstrate/DynamicLibraries/Icon110\.(dylib|plist))$' || true)"
          if [[ -n "$unexpected_data" ]]; then
            echo "Unexpected package payload entries:" >&2
            printf '%s\n' "$unexpected_data" >&2
            exit 1
          fi

          test "$(printf '%s\n' "$data_entries" | grep -c '^Library/MobileSubstrate/DynamicLibraries/Icon110\.dylib$')" -eq 1
          test "$(printf '%s\n' "$data_entries" | grep -c '^Library/MobileSubstrate/DynamicLibraries/Icon110\.plist$')" -eq 1
          if dpkg-deb --fsys-tarfile "$deb" | tar -tvf - | grep -E '^l'; then
            echo "Symbolic links are not allowed in this package" >&2
            exit 1
          fi

          shasum -a 256 "$deb"

      - name: Upload RootHide package
        uses: actions/upload-artifact@v4
        with:
          name: Icon110-RootHide
          path: packages/*.deb
          if-no-files-found: error
